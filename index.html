<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="description" content="COSMOS Arogya — Your AI Health Companion"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Arogya"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>COSMOS Arogya</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --blue:#0A84FF;--blue-d:#0066CC;--blue-l:#E8F3FF;--blue-xl:#F5FAFF;
  --teal:#00B39C;--teal-l:#E0FAF6;
  --mint:#30D158;--mint-l:#E3FBE9;
  --coral:#FF453A;--coral-l:#FFEBEA;
  --amber:#FF9F0A;--amber-l:#FFF4E0;
  --violet:#AF52DE;--violet-l:#F6EBFC;
  --pink:#FF2D92;--pink-l:#FFE5F1;
  --indigo:#5E5CE6;--indigo-l:#ECECFD;

  --white:#FFFFFF;--bg:#F2F2F7;--bg2:#E5E5EA;--card:#FFFFFF;
  --sep:rgba(60,60,67,.1);--sep2:rgba(60,60,67,.18);

  --t1:#000000;--t2:#3C3C43;--t2o:rgba(60,60,67,.6);--t3:rgba(60,60,67,.4);--t4:rgba(60,60,67,.25);

  --r-sm:10px;--r:16px;--r-lg:22px;--r-xl:28px;

  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow:0 8px 24px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 20px 48px rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.08);

  --ease:cubic-bezier(.36,.66,.04,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);

  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--t1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:pan-y;}
input,textarea,.symp-inp,.hp-search-wrap input,.chat-inp-row input{-webkit-user-select:text;user-select:text;}
.app-scroll{overscroll-behavior-y:contain;}
#app{height:100%;display:flex;flex-direction:column;position:relative;}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:none;}
input,textarea{font-family:inherit;-webkit-appearance:none;appearance:none;}
svg{display:block;}
::selection{background:var(--blue-l);}

.scr{display:none;flex-direction:column;height:100%;overflow:hidden;}
.scr.on{display:flex;animation:screenIn .4s var(--ease);}
@keyframes screenIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes iconPop{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ══ SPLASH ══ */
#scr-splash{background:#000;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.mesh-bg{position:absolute;inset:0;overflow:hidden;}
.mesh-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:meshFloat 8s ease-in-out infinite;}
.mesh-blob.b1{width:280px;height:280px;background:var(--blue);top:-80px;left:-60px;}
.mesh-blob.b2{width:320px;height:320px;background:var(--teal);bottom:-100px;right:-80px;animation-delay:2s;}
.mesh-blob.b3{width:240px;height:240px;background:var(--violet);top:40%;left:60%;animation-delay:4s;}
@keyframes meshFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.95)}}
.sp-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
.sp-icon{width:100px;height:100px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;box-shadow:0 20px 60px rgba(10,132,255,.3);animation:iconPop 1s var(--ease-spring);}
.sp-icon svg{width:58px;height:58px;}
.sp-name{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.6px;animation:fadeUp .6s var(--ease) .3s both;}
.sp-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:7px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;animation:fadeUp .6s var(--ease) .4s both;}
.sp-dots{margin-top:52px;display:flex;gap:8px;animation:fadeUp .6s var(--ease) .6s both;}
.sp-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);}
.sp-dot.active{background:#fff;animation:dotPulse 1.4s ease-in-out infinite;}
.sp-dot:nth-child(2){animation-delay:.15s;}.sp-dot:nth-child(3){animation-delay:.3s;}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.3);opacity:1}}

/* ══ LANGUAGE ══ */
#scr-lang{background:var(--white);}
.lang-top{background:linear-gradient(160deg,#0A84FF 0%,#00B39C 100%);padding:calc(32px + var(--st)) 24px 32px;
  text-align:center;position:relative;overflow:hidden;}
.lang-top::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),transparent 60%);}
.lang-logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;position:relative;z-index:1;}
.lang-logo-ico{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;}
.lang-logo-name{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.2px;}
.lang-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;position:relative;z-index:1;letter-spacing:-.5px;}
.lang-hint{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.6;position:relative;z-index:1;}
.lang-list{flex:1;overflow-y:auto;padding:20px 20px 0;background:var(--bg);}
.lang-list::-webkit-scrollbar{display:none;}
.lang-btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);background:var(--white);
  margin-bottom:10px;transition:all .25s var(--ease);width:100%;text-align:left;box-shadow:var(--shadow-xs);
  animation:slideUp .4s var(--ease) both;}
.lang-btn:nth-child(1){animation-delay:.05s}.lang-btn:nth-child(2){animation-delay:.1s}
.lang-btn:nth-child(3){animation-delay:.15s}.lang-btn:nth-child(4){animation-delay:.2s}.lang-btn:nth-child(5){animation-delay:.25s}
.lang-btn:active{transform:scale(.98);background:var(--blue-xl);}
.lang-btn.sel{background:var(--blue-l);box-shadow:0 0 0 2px var(--blue) inset;}
.lang-flag{font-size:26px;flex-shrink:0;}
.lang-inf{flex:1;}
.lang-nm{font-size:15px;font-weight:700;color:var(--t1);}
.lang-nat{font-size:12.5px;color:var(--t2o);margin-top:2px;}
.lang-chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sep2);display:flex;align-items:center;
  justify-content:center;transition:all .25s var(--ease-spring);flex-shrink:0;}
.lang-btn.sel .lang-chk{background:var(--blue);border-color:var(--blue);transform:scale(1.1);}
.lang-chk svg{width:12px;height:12px;opacity:0;stroke:#fff;transform:scale(.5);transition:all .2s;}
.lang-btn.sel .lang-chk svg{opacity:1;transform:scale(1);}
.lang-foot{padding:16px 20px;padding-bottom:calc(16px + var(--sb));background:var(--white);border-top:.5px solid var(--sep);}
.btn-primary{width:100%;padding:17px;border-radius:var(--r);background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  font-size:16px;font-weight:700;color:#fff;transition:all .2s var(--ease);letter-spacing:-.2px;
  box-shadow:0 8px 20px rgba(10,132,255,.35);}
.btn-primary:active{transform:scale(.97);box-shadow:0 4px 10px rgba(10,132,255,.3);}

/* ══ LOGIN ══ */
#scr-login{background:var(--white);align-items:center;justify-content:center;padding:32px 28px;
  padding-top:calc(32px + var(--st));position:relative;overflow:hidden;}
.lo-mesh{position:absolute;inset:0;opacity:.5;pointer-events:none;}
.lo-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;}
.lo-blob.a{width:260px;height:260px;background:var(--blue);top:-100px;right:-80px;}
.lo-blob.b{width:220px;height:220px;background:var(--teal);bottom:-60px;left:-60px;}
.lo-hero{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--blue) 0%,var(--teal) 100%);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;position:relative;z-index:1;
  box-shadow:0 16px 40px rgba(10,132,255,.3);animation:iconPop .7s var(--ease-spring);}
.lo-hero svg{width:50px;height:50px;}
.lo-name{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:-.6px;position:relative;z-index:1;animation:fadeUp .5s var(--ease) .1s both;}
.lo-tagline{font-size:14.5px;color:var(--t2o);text-align:center;max-width:290px;line-height:1.6;margin:10px 0 32px;
  position:relative;z-index:1;animation:fadeUp .5s var(--ease) .2s both;}
.lo-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px;position:relative;z-index:1;
  animation:fadeUp .5s var(--ease) .3s both;max-width:320px;}
.lo-feat{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;background:var(--bg);
  border:.5px solid var(--sep2);font-size:11.5px;font-weight:600;color:var(--t2);}
.lo-feat svg{width:13px;height:13px;stroke:var(--blue);flex-shrink:0;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:310px;padding:16px 24px;
  border-radius:var(--r);background:var(--t1);font-size:15px;font-weight:600;color:#fff;transition:all .2s var(--ease);
  box-shadow:var(--shadow);position:relative;z-index:1;animation:fadeUp .5s var(--ease) .4s both;}
.btn-google:active{transform:scale(.97);}
.btn-google svg{width:20px;height:20px;flex-shrink:0;}
.lo-guest{margin-top:14px;font-size:13.5px;color:var(--blue);font-weight:600;position:relative;z-index:1;
  animation:fadeUp .5s var(--ease) .5s both;padding:8px;}
.lo-terms{font-size:11px;color:var(--t3);text-align:center;margin-top:18px;line-height:1.6;max-width:280px;
  position:relative;z-index:1;animation:fadeUp .5s var(--ease) .6s both;}

/* ══ MAIN APP ══ */
#scr-app{background:var(--bg);}
.app-scroll{flex:1;overflow-y:auto;padding-bottom:calc(78px + var(--sb));-webkit-overflow-scrolling:touch;}
.app-scroll::-webkit-scrollbar{display:none;}
.tab{display:none;}
.tab.on{display:block;animation:fadeUp .3s var(--ease) both;}

.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;
  padding:10px 6px;padding-bottom:calc(10px + var(--sb));background:rgba(255,255,255,.85);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:.5px solid var(--sep);z-index:100;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 14px;min-width:58px;
  transition:transform .2s var(--ease-spring);}
.nav-btn:active{transform:scale(.88);}
.nav-btn svg{width:23px;height:23px;stroke:var(--t3);transition:all .25s var(--ease);stroke-width:1.8;}
.nav-btn span{font-size:10px;color:var(--t3);font-weight:600;transition:color .25s;}
.nav-btn.on svg{stroke:var(--blue);transform:translateY(-1px) scale(1.05);}
.nav-btn.on span{color:var(--blue);}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin-top:1px;opacity:0;transition:opacity .2s;}
.nav-btn.on .nav-dot{opacity:1;}

/* ══ HOME ══ */
.home-header{background:linear-gradient(160deg,#0A84FF 0%,#00B39C 100%);padding:calc(20px + var(--st)) 20px 32px;
  display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;}
.home-header::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% -10%,rgba(255,255,255,.2),transparent 50%);}
.home-greet{font-size:13.5px;color:rgba(255,255,255,.82);margin-bottom:4px;font-weight:600;position:relative;z-index:1;}
.home-name{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px;position:relative;z-index:1;}
.home-av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);
  font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;
  position:relative;z-index:1;transition:transform .2s var(--ease-spring);}
.home-av:active{transform:scale(.92);}
.home-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

.stats-strip{display:flex;margin:0 20px;margin-top:-20px;border-radius:var(--r-lg);background:var(--white);
  box-shadow:var(--shadow-lg);overflow:hidden;position:relative;z-index:2;animation:scaleIn .5s var(--ease-spring) .1s both;}
.stat-cell{flex:1;padding:16px 8px;text-align:center;position:relative;}
.stat-cell+.stat-cell::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:.5px;background:var(--sep2);}
.stat-v{font-size:24px;font-weight:800;color:var(--t1);letter-spacing:-.5px;}
.stat-l{font-size:10.5px;color:var(--t3);margin-top:3px;font-weight:600;}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px;}
.sec-title{font-size:19px;font-weight:800;color:var(--t1);letter-spacing:-.4px;}

.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;margin-bottom:4px;}
.feat-card{padding:18px;border-radius:var(--r-lg);background:var(--white);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s var(--ease-spring),box-shadow .18s;box-shadow:var(--shadow-sm);animation:slideUp .4s var(--ease) both;}
.feat-card:nth-child(1){animation-delay:.1s}.feat-card:nth-child(2){animation-delay:.15s}
.feat-card:nth-child(3){animation-delay:.2s}.feat-card:nth-child(4){animation-delay:.25s}
.feat-card:active{transform:scale(.95);}
.feat-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.feat-ico svg{width:23px;height:23px;}
.feat-name{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:3px;letter-spacing:-.2px;}
.feat-desc{font-size:11.5px;color:var(--t2o);line-height:1.4;}

.tip-card{margin:16px 20px 0;padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--blue-l) 0%,var(--teal-l) 100%);display:flex;align-items:flex-start;gap:14px;
  animation:slideUp .4s var(--ease) .3s both;}
.tip-icon-wrap{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.7);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:20px;}
.tip-label{font-size:10.5px;font-weight:800;color:var(--blue-d);letter-spacing:.06em;margin-bottom:4px;}
.tip-text{font-size:12.5px;color:var(--t2);line-height:1.6;}

.act-list{padding:0 20px;display:flex;flex-direction:column;gap:9px;margin-bottom:24px;}
.act-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:var(--r);background:var(--white);
  box-shadow:var(--shadow-xs);}
.act-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.act-ico svg{width:19px;height:19px;}
.act-info{flex:1;min-width:0;}
.act-name{font-size:13px;font-weight:700;color:var(--t1);}
.act-time{font-size:10.5px;color:var(--t3);margin-top:2px;}

.bdg{padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;letter-spacing:-.1px;}
.bdg-blue{background:var(--blue-l);color:var(--blue-d);}
.bdg-teal{background:var(--teal-l);color:#007A6B;}
.bdg-coral{background:var(--coral-l);color:#CC2E24;}
.bdg-amber{background:var(--amber-l);color:#B8720A;}
.bdg-violet{background:var(--violet-l);color:#8E3CB8;}
.bdg-mint{background:var(--mint-l);color:#1D9E42;}
.bdg-pink{background:var(--pink-l);color:#C61762;}
.bdg-indigo{background:var(--indigo-l);color:#3634A3;}

/* ══ SCAN ══ */
.scan-header{background:var(--white);padding:calc(18px + var(--st)) 20px 16px;border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;}
.scan-title{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;}

.cam-wrap{margin:18px 20px;border-radius:var(--r-xl);overflow:hidden;height:240px;background:#000;position:relative;
  box-shadow:var(--shadow-lg);animation:scaleIn .4s var(--ease-spring);}
#scan-video{width:100%;height:100%;object-fit:cover;display:block;}
#upload-preview{width:100%;height:100%;object-fit:cover;display:none;}
#scan-canvas{display:none;}
.cam-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:170px;height:115px;}
.cf-tl,.cf-tr,.cf-bl,.cf-br{position:absolute;width:24px;height:24px;border-color:#fff;border-style:solid;}
.cf-tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:6px 0 0 0;}
.cf-tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 6px 0 0;}
.cf-bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 6px;}
.cf-br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 6px 0;}
.cam-scanline{position:absolute;top:30%;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,transparent,#0A84FF,transparent);box-shadow:0 0 12px 2px rgba(10,132,255,.6);
  animation:scanmove 2.2s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:25%}50%{top:75%}}
.cam-live{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);}
.live-dot{width:7px;height:7px;border-radius:50%;background:#FF453A;animation:pulse2 1.2s infinite;}
.live-txt{font-size:10.5px;color:#fff;font-weight:700;letter-spacing:.03em;}
.cam-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.85);font-weight:600;}
.cam-proc{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;}
.proc-ring{width:52px;height:52px;border:3px solid rgba(10,132,255,.25);border-top-color:var(--blue);border-radius:50%;
  animation:spin .9s linear infinite;}
.proc-txt{font-size:14px;color:#fff;font-weight:600;}

.scan-actions{display:flex;gap:10px;padding:0 20px;margin-bottom:18px;}
.s-btn{flex:1;padding:14px 8px;border-radius:var(--r);font-size:12px;font-weight:700;background:var(--white);color:var(--t2);
  transition:transform .15s var(--ease-spring);text-align:center;box-shadow:var(--shadow-xs);letter-spacing:-.1px;}
.s-btn.pri{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;box-shadow:0 8px 20px rgba(10,132,255,.35);}
.s-btn:active{transform:scale(.94);}

.res-wrap{margin:0 20px 14px;animation:slideUp .4s var(--ease);}
